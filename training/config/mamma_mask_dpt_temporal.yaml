defaults:
  - default_dataset_smpl.yaml

# export CUDA_VISIBLE_DEVICES=2
# export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
# export PYTHONPATH=/mnt/train-data-4-hdd/yian/vggt_multi_0621_mamma_demo_eval_bundle:/mnt/train-data-4-hdd/yian/vggt_multi_0621_mamma_demo_eval_bundle/training
# torchrun --standalone --nproc_per_node=1 launch.py --config mamma_mask_dpt_temporal

# Framewise SMPL pose/beta training with temporal regularization. Dense
# landmark/contact/person-mask heads are disabled; multi-person identity is
# aligned with the remaining pose/beta/translation/presence Hungarian costs.
exp_name: mamma_mask_dpt_noavgscale_1e-5_temporal

debug_max_sequences: null
debug_max_frames_per_sequence: null
debug_val_max_sequences: null
debug_val_max_frames_per_sequence: null
# ----------------------------------------------------------------------------

# Framewise model + temporal-loss training. The aggregator/head still run once
# per frame; the dataset groups consecutive frames and the loss couples their
# Hungarian-matched identities. Flip only `enabled` to return to the exact
# original single-frame data/model/loss path.
temporal_training:
  enabled: True
  clip_length: 5          # order-2 pose/translation needs at least 3 frames
  clip_stride: 1
  loss_type: l1
  pose_order: 2
  beta_order: 1
  mesh_translate_order: 2
  exclude_root: True      # cam0-frame root orientation is not smoothed
  weight_pose: 0.05
  weight_beta: 0.01
  weight_mesh_translate: 0.05

img_size: 518
# One temporal sample decodes 5 frames x 8 views. Keep several samples in
# flight so image I/O and CPU preprocessing overlap with GPU execution.
num_workers: 0
seed_value: 42
accum_steps: 1            # consider 4-8: Hungarian matching is noisy at batch=1
# Keep the cam0 coordinate-frame normalization, but preserve the dataset's
# original metric scale instead of dividing by the mean camera baseline.
# Trainer will therefore set batch["avg_scale"] to 1.0.
scale_by_extrinsics: False
patch_size: 14
val_epoch_freq: 5
enable_val: False
# The sampler counts T*V images when temporal training is enabled. With T=5,
# V=8 and this budget, each optimizer step contains 5 clips (200 images).
max_img_per_gpu: 200

limit_train_batches: null
limit_val_batches: 10


data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    pin_memory: True
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: True
      img_nums: [8, 8]
      fixed_view_sampling: False
      use_temporal_training: ${temporal_training.enabled}
      temporal_clip_length: ${temporal_training.clip_length}
      temporal_clip_stride: ${temporal_training.clip_stride}
      inside_random: False
      rescale_aug: False
      augs:
        aspects: [1.0, 1.0]
        scales: null
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.sys_smpl_multi.SysSMPLMultiDataset
          split: train
          SysSMPL_DIR: /dataset/mamma
          SysSMPL_ANNOTATION_DIR: /dataset/mamma
          max_num_people: 6
          min_num_images: 8
          # Auxiliary dense targets are not needed for pose/beta temporal training.
          emit_landmarks: False
          emit_contact: False
          emit_person_mask: False
          max_sequences: ${debug_max_sequences}
          max_frames_per_sequence: ${debug_max_frames_per_sequence}
  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    pin_memory: True
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: False
      img_nums: [8, 8]
      fixed_view_sampling: True
      use_temporal_training: ${temporal_training.enabled}
      temporal_clip_length: ${temporal_training.clip_length}
      temporal_clip_stride: ${temporal_training.clip_stride}
      inside_random: False
      augs:
        aspects: [1.0, 1.0]
        scales: null
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.sys_smpl_multi.SysSMPLMultiDataset
          split: test
          SysSMPL_DIR: /dataset/mamma
          SysSMPL_ANNOTATION_DIR: /dataset/mamma
          max_num_people: 6
          min_num_images: 8
          emit_landmarks: False
          emit_contact: False
          emit_person_mask: False
          max_sequences: ${debug_val_max_sequences}
          max_frames_per_sequence: ${debug_val_max_frames_per_sequence}


logging:
  log_dir: logs/${exp_name}
  use_wandb: True
  log_visuals: False
  log_freq: 1
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  wandb_writer:
    _target_: train_utils.wandb_logger.WandbLogger
    path: ${logging.log_dir}/wandb
    project: vggt_multi
    entity: null
    name: ${exp_name}
    mode: online
    resume: null
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_smpl
        - loss_smpl_losses
        # - loss_smpl_global_orient
        # - loss_smpl_global_orient_init
        - loss_mesh_translate
        - loss_smpl_presence
        - loss_smpl_joints2d
        - loss_smpl_joints3d
        - loss_smpl_vertices
        - loss_smpl_temporal_pose
        - loss_smpl_temporal_beta
        - loss_smpl_temporal_mesh_translate
        - hungarian_presence_cost
        - smpl_presence_positive_prob_mean
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_smpl
        - loss_smpl_losses
        # - loss_smpl_global_orient
        # - loss_smpl_global_orient_init
        - loss_mesh_translate
        - loss_smpl_presence
        - loss_smpl_joints2d
        - loss_smpl_joints3d
        - loss_smpl_vertices
        - loss_smpl_temporal_pose
        - loss_smpl_temporal_beta
        - loss_smpl_temporal_mesh_translate
        - hungarian_presence_cost
        - smpl_presence_positive_prob_mean


checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  save_step_freq: 5000
  resume_checkpoint_path: "/Multi_SMPL_0706/logs/mamma_mask_dpt_noavgscale_5e-5_continue/ckpts/checkpoint_7.pt"
  strict: False
  load_aggregator_only: False
  load_model_only: True  
  # No person-mask head is constructed in this temporal pose/beta run.
  init_mask_trunk_from_depth: False


loss:
  _target_: loss.MultitaskLoss
  # local path (this box has no /dataset mount; matches the dataset paths above)
  smplx_model_dir: /dataset/smplx_models
  camera:
    weight: 5.0
    loss_type: "l1"
  depth: null
  smpl:
    weight: 1.0
    loss_type: l1
    loss_type_joints2d: l1
    loss_type_joints3d: l1

    weight_pose: 1.0
    # Explicit cam0-frame root rotation supervision (radians). The aggregate
    # pose loss averages the root with 23 local joints, so start with a separate
    # moderate weight; sweep 0.1/0.25/0.5 after checking flip-rate metrics.
    weight_global_orient: 0.0
    weight_beta: 0.001
    init_w: 1.0
    weight_joints2d: 1.0
    weight_joints3d: 1.0
    weight_vertices: 1.5
    use_temporal_training: ${temporal_training.enabled}
    weight_temporal_pose: ${temporal_training.weight_pose}
    weight_temporal_beta: ${temporal_training.weight_beta}
    weight_temporal_mesh_translate: ${temporal_training.weight_mesh_translate}
    temporal_pose_order: ${temporal_training.pose_order}
    temporal_beta_order: ${temporal_training.beta_order}
    temporal_mesh_translate_order: ${temporal_training.mesh_translate_order}
    temporal_loss_type: ${temporal_training.loss_type}
    temporal_exclude_root: ${temporal_training.exclude_root}
    weight_trans: 0.0
    weight_mesh_translate: 2.0
    weight_presence: 0.5
    presence_loss_type: focal
    presence_focal_alpha: null
    presence_focal_gamma: 2.0

    # landmark head disabled in this ablation.
    weight_landmark: 0.0
    weight_landmark_vis: 0.0
    weight_contact: 0.0
    weight_floor_contact: 0.0

    weight_mask: 0.0

    use_gt: False
    joints2d_use_gt_camera: True
    normalize_cam: True
    use_mamma: True
    use_hungarian: True
    hungarian_cost_pose_weight: 1.0
    hungarian_cost_beta_weight: 0.1
    hungarian_cost_trans_weight: 0.0
    hungarian_cost_mesh_trans_weight: 0.3
    hungarian_cost_presence_weight: 0.05
    # Mask matching is unavailable because the person-mask head/GT are disabled.
    hungarian_cost_mask_weight: 0.0
  track: null


optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5
    weight_decay: 0.0

  frozen_module_names:
      - "*aggregator*"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["smpl"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          # Linear warm-up over the first 5% of training (1e-8 -> peak lr), then
          # cosine decay (peak lr -> 1e-8) over the remaining 95%. Same shape as
          # 0621_mamma.yaml. The camera/SMPL heads start from a fresh optimizer
          # (load_model_only), so a cold high learning rate can spike gradients.
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: ${optim.optimizer.lr}
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: ${optim.optimizer.lr}
              end_value: 1e-8
          lengths: [0.01, 0.99]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0


max_epochs: 100

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: False
  enable_point: False
  enable_track: False
  enable_smpl: False
  enable_smpl_multi_query: False
  enable_smpl_multi_query_trans: False
  enable_smpl_multi_query_trans_rot: True
  smpl_num_people: 20
  # Auxiliary landmark and person-mask heads are disabled.
  enable_smpl_dense_landmark: False
  enable_person_mask: False
  landmark_use_mask_embedding: False
  landmark_predict_contact: False

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: True
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True
