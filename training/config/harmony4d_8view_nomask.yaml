defaults:
  - default_dataset_smpl.yaml
  - _self_

# Fine-tune the 8-view trans+rot SMPL head on real Harmony4D exo imagery.
# Harmony4D supplies standard neutral SMPL (6890 vertices), not MAMMA SMPL-X,
# and has no native instance-mask target used by this repository.
exp_name: harmony4d_real_8view_nomask

img_size: 518
patch_size: 14
num_workers: 4
seed_value: 42
accum_steps: 1
max_img_per_gpu: 8        # 8 views/sample -> one multi-view sample per GPU
scale_by_extrinsics: False # preserve Harmony4D's metric scale; still normalize to cam0

enable_val: True
val_epoch_freq: 5
limit_train_batches: null
limit_val_batches: 20

# Sequence-level split prevents adjacent-frame leakage. The local Harmony4D
# directory contains the official training portion, so reserve 10% of sequences.
val_sequence_fraction: 0.1
split_seed: 42

# Debug caps: set e.g. 1/2 for a quick loader/training smoke test.
debug_max_sequences: null
debug_max_frames_per_sequence: null
debug_val_max_sequences: null
debug_val_max_frames_per_sequence: null

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: True
    pin_memory: True
    persistent_workers: True
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: True
      img_nums: [8, 8]
      fixed_view_sampling: False
      inside_random: False
      rescale_aug: False
      augs:
        aspects: [1.0, 1.0]
        scales: null
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.harmony4d.Harmony4DDataset
          split: train
          Harmony4D_DIR: /train-data-2-hdd/yian/Multi_SMPL_Dataset_real/Harmony4D
          min_num_images: 8
          max_num_people: 2
          body_model_type: smpl
          smplx_annotation_root: null
          val_sequence_fraction: ${val_sequence_fraction}
          split_seed: ${split_seed}
          # Resize 4K -> <=1280 before fisheye remap; maps are cached per worker.
          undistort_max_side: 1280
          undistort_balance: 0.0
          undistort_cache_size: 8
          fixed_anchor_camera: null
          max_sequences: ${debug_max_sequences}
          max_frames_per_sequence: ${debug_max_frames_per_sequence}

  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: False
    pin_memory: True
    persistent_workers: True
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      training: False
      img_nums: [8, 8]
      fixed_view_sampling: True
      inside_random: False
      rescale_aug: False
      augs:
        aspects: [1.0, 1.0]
        scales: null
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.harmony4d.Harmony4DDataset
          split: val
          Harmony4D_DIR: /train-data-2-hdd/yian/Multi_SMPL_Dataset_real/Harmony4D
          min_num_images: 8
          max_num_people: 2
          body_model_type: smpl
          smplx_annotation_root: null
          val_sequence_fraction: ${val_sequence_fraction}
          split_seed: ${split_seed}
          undistort_max_side: 1280
          undistort_balance: 0.0
          undistort_cache_size: 8
          fixed_anchor_camera: null
          max_sequences: ${debug_val_max_sequences}
          max_frames_per_sequence: ${debug_val_max_frames_per_sequence}

logging:
  log_dir: logs/${exp_name}
  use_wandb: True
  log_visuals: False
  log_freq: 10
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  wandb_writer:
    _target_: train_utils.wandb_logger.WandbLogger
    path: ${logging.log_dir}/wandb
    project: vggt_multi
    entity: null
    name: ${exp_name}
    mode: online
    resume: null
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_smpl
        - loss_smpl_losses
        # - loss_smpl_global_orient
        # - loss_smpl_global_orient_init
        - loss_mesh_translate
        - loss_smpl_presence
        - loss_smpl_joints2d
        - loss_smpl_joints3d
        - loss_smpl_vertices
        - hungarian_presence_cost
        - smpl_presence_positive_prob_mean
        - smpl_presence_empty_prob_mean
        - smpl_joints2d_max_abs
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_smpl
        - loss_smpl_losses
        # - loss_smpl_global_orient
        # - loss_smpl_global_orient_init
        - loss_mesh_translate
        - loss_smpl_presence
        - loss_smpl_joints2d
        - loss_smpl_joints3d
        - loss_smpl_vertices
        - hungarian_presence_cost
        - smpl_presence_positive_prob_mean
        - smpl_presence_empty_prob_mean
        - smpl_joints2d_max_abs

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  save_step_freq: 5000
  resume_checkpoint_path: /train-data-3-hdd/yian/Multi_SMPL_0706/model/no_avg_8view/checkpoint_18.pt
  strict: False
  load_aggregator_only: False
  load_model_only: True

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 1.0
    loss_type: l1
  depth: null
  smpl:
    weight: 1.0
    loss_type: l1
    loss_type_joints2d: l1
    loss_type_joints3d: l1

    weight_pose: 1.0
    weight_global_orient: 0.0
    weight_beta: 0.001
    init_w: 1.0
    weight_joints2d: 1.0
    weight_joints3d: 1.0
    weight_vertices: 1.5
    weight_trans: 0.0
    weight_mesh_translate: 2.0
    weight_presence: 0.5
    presence_loss_type: focal
    presence_focal_alpha: null
    presence_focal_gamma: 2.0

    # Harmony4D loader intentionally emits no mask/landmark/contact GT.
    weight_landmark: 0.0
    weight_landmark_vis: 0.0
    weight_contact: 0.0
    weight_floor_contact: 0.0
    weight_mask: 0.0

    use_gt: False
    joints2d_use_gt_camera: True
    normalize_cam: True
    use_mamma: False       # critical: Harmony4D is neutral SMPL, not SMPL-X
    use_hungarian: True
    hungarian_cost_pose_weight: 1.0
    hungarian_cost_beta_weight: 0.1
    hungarian_cost_trans_weight: 0.0
    hungarian_cost_mesh_trans_weight: 0.3
    hungarian_cost_presence_weight: 0.05
    hungarian_cost_mask_weight: 0.0
    hungarian_mask_cost_grid: 32
  track: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-5
    weight_decay: 0.0
  # Start with head-only real-data adaptation. Unfreeze the aggregator in a
  # later experiment only after the geometry/loss baselines are stable.
  frozen_module_names:
    - "*aggregator*"
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["smpl"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: ${optim.optimizer.lr}
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: ${optim.optimizer.lr}
              end_value: 1e-8
          lengths: [0.01, 0.99]
          interval_scaling: [rescaled, rescaled]
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0

max_epochs: 100

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: True
  enable_depth: False
  enable_point: False
  enable_track: False
  enable_smpl: False
  enable_smpl_multi_query: False
  enable_smpl_multi_query_trans: False
  enable_smpl_multi_query_trans_rot: True
  # Keep checkpoint-compatible slot count; Harmony4D GT has exactly 2 positives.
  smpl_num_people: 20
  enable_smpl_dense_landmark: False
  enable_person_mask: False
  landmark_use_mask_embedding: False
  landmark_predict_contact: False

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: True
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True
